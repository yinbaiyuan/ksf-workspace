name: Sync official ksf-workspace template
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ksf-template
  cancel-in-progress: false
jobs:
  sync:
    # Copies of this template never run the official publication job.
    if: github.repository == '__KSF_TEMPLATE_REPOSITORY__'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Mirror the latest verified public Core release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KSF_SKIP_AUTO_UPDATE: '1'
        run: ./.agents/bin/ksf release mirror --json
